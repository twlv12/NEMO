<!DOCTYPE html>
<html>
<head>
    <title>NEMO</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 12px;
            padding-right: 180px;
            background-color: #111;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 12px;
            min-height: 100vh;
            font-family: consolas, monospace;
            color: white;
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9);
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            width: 160px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }

        button {
            width: 100%;
            margin-bottom: 8px;
            padding: 6px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-family: consolas, monospace;
            font-size: 12px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        button:hover {
            background: #444;
            border-color: #8fdfff;
        }
        
        select, input[type="number"] {
            background: #1a1a1a;
            color: white;
            border: 1px solid #555;
            padding: 4px;
            border-radius: 4px;
            font-family: consolas, monospace;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div style="margin-bottom: 12px; color: #8fdfff; font-size: 14px; font-weight: bold; text-align: center;">Controls</div>
        <button id="pauseBtn" onclick="togglePause()">PAUSE</button>
        <button onclick="reloadConfig()">RELOAD CONFIG</button>
        <hr style="border-color: #444; margin: 8px 0;">
        <button onclick="switchView(0, 'index.html')">View Petri Dish</button>
        <button onclick="switchView(1, 'genome.html')">View Genomes</button>
        <button onclick="switchView(2, 'brain.html')">View Brains</button>
        <hr style="border-color: #444; margin: 8px 0;">
    </div>

    <script>
        const graphNames = [
            "alpha",
            "beta",
            "gamma",
            "delta"
        ];
        let runtimeConfig = {};
        const networks = [];

        const socket = new WebSocket("ws://127.0.0.1:8181");

        let autoRestart = false;
        let pauseOnExtinction = true;

        socket.onopen = () => {
            console.log("Connected to NEMO (Brain View)");
        };
        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.event === "syncState") {
                    isPaused = data.isPaused;
                    autoRestart = data.autoRestart;
                    pauseOnExtinction = data.pauseOnExtinction;

                    const pBtn = document.getElementById('pauseBtn');
                    if (pBtn) {
                        pBtn.innerText = isPaused ? "RESUME" : "PAUSE";
                        pBtn.style.borderColor = isPaused ? "tomato" : "#555";
                    }
                    const arCheck = document.getElementById('autoRestart');
                    if (arCheck) {
                        arCheck.checked = autoRestart;
                    }
                    const poeCheck = document.getElementById('pauseOnExtinction');
                    if (poeCheck) {
                        poeCheck.checked = pauseOnExtinction;
                    }
                    return;
                }

                if (data.graph && data.nodes && data.edges && data.isDead !== undefined) {
                    const graphObj = networks.find(n => n.name === data.graph);
                    if (graphObj) {

                        if (graphObj.deadOverlay) {
                            graphObj.deadOverlay.style.display = data.isDead ? "flex" : "none";
                        }

                        if (data.isPaused !== undefined && data.isPaused !== isPaused) {
                            isPaused = data.isPaused;
                            const pBtn = document.getElementById('pauseBtn');
                            if (pBtn) {
                                pBtn.innerText = isPaused ? "RESUME" : "PAUSE";
                                pBtn.style.borderColor = isPaused ? "tomato" : "#555";
                            }
                        }

                        if (data.isDead) return;

                        const nodeIDs = new Set(data.nodes.map(n => n.id));
                        const edgeIDs = new Set(data.edges.map(e => e.id));

                        graphObj.data.nodes.forEach(node => {
                            if (!nodeIDs.has(node.id)) graphObj.data.nodes.remove(node.id);
                        });
                        graphObj.data.edges.forEach(edge => {
                            if (!edgeIDs.has(edge.id)) graphObj.data.edges.remove(edge.id);
                        });

                        for (const node of data.nodes) {
                            const v = Math.abs(node.activation);

                            let bg;
                            switch (node.neuronType) {
                                case "Sensor": bg = "rgb(40,120,255)"; break;
                                case "Math": bg = "rgb(255, 255, 255)"; break;
                                case "Action": bg = "rgb(151, 63, 209)"; break;
                                default: bg = "rgb(180,180,180)";
                            }

                            let border = node.activation >= 0 ? "rgb(150,240,255)" : "rgb(255,90,90)";
                            node.color = { background: bg, border: border };

                            const alpha = Math.min(0.15 + v * 0.85, 1);
                            node.shadow = {
                                enabled: v > 0.04,
                                color: node.activation >= 0 ? `rgba(100,220,255,${alpha})` : `rgba(255,70,0,${alpha})`,
                                size: 30,
                                x: 0,
                                y: 0
                            };

                            node.borderWidth = v * 15;
                            const degree = (node.incoming || 0) + (node.outgoing || 0);
                            node.size = 7 + Math.sqrt(degree) * 10;
                        }

                        for (const edge of data.edges) {
                            const s = Math.abs(edge.signal);
                            edge.width = 0.5 + s * 10;
                            const alpha = 0.25 + s * 1.5;
                            const intensity = Math.floor(60 + s * 300);

                            if (edge.signal >= 0) {
                                edge.color = `rgb(0,${intensity},255)`;
                            } else {
                                edge.color = `rgb(${intensity},80,80)`;
                            }
                        }
                        // --------------------------------

                        graphObj.data.nodes.update(data.nodes);
                        graphObj.data.edges.update(data.edges);
                    }
                }
            } catch (err) {
                console.error("JSON Parse Error:", err);
            }
        };

        const controls = document.getElementById("controls");
        let isPaused = false;

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.innerText = isPaused ? "RESUME" : "PAUSE";
            btn.style.borderColor = isPaused ? "tomato" : "#555";
            socket.send(JSON.stringify({ action: "togglePause" }));
        }

        function toggleAutoRestart() {
            socket.send(JSON.stringify({ action: "toggleAutoRestart" }));
        }

        function killCreature() {
            if (selectedCreatureId) {
                socket.send(JSON.stringify({ action: "killCreature", creatureId: selectedCreatureId }));
            }
            hideContextMenu();
        }

        function reloadConfig() {
            socket.send(JSON.stringify({ action: "reloadConfig" }));
        }

        function switchView(viewId, url) {
            window.location.href = url;
        }

        function createSlider(def) {
            const wrapper = document.createElement("div");
            wrapper.style.marginBottom = "10px";

            const label = document.createElement("div");
            label.innerText =`${def.key}: ${runtimeConfig[def.key]}`;
            label.style.fontSize = "12px";

            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = def.min;
            slider.max = def.max;
            slider.step = def.step;
            console.log(def.key, runtimeConfig[def.key]);
            slider.value = runtimeConfig[def.key];;
            slider.style.width = "100%";

            slider.oninput = async () => {
                const value = parseFloat(slider.value);
                runtimeConfig[def.key] = value;;
                label.innerText = `${def.key}: ${value.toFixed(4)}`;

                await fetch("/config",
                    {
                        method: "POST",
                        headers:
                        {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(runtimeConfig)
                    });
            };

            wrapper.appendChild(label);
            wrapper.appendChild(slider);

            controls.appendChild(wrapper);
        }
        function createGraphContainer(name) {
            const box = document.createElement("div");

            box.style.width = "48%";
            box.style.height = "500px";
            box.style.background = "#1a1a1a";
            box.style.border = "1px solid #333";
            box.style.position = "relative";

            const title = document.createElement("div");
            title.innerText = name;

            title.style.position = "absolute";
            title.style.left = "10px";
            title.style.top = "6px";
            title.style.color = "white";
            title.style.fontFamily = "consolas";
            title.style.fontSize = "14px";
            title.style.zIndex = "10";

            const graphDiv = document.createElement("div");

            graphDiv.style.width = "100%";
            graphDiv.style.height = "100%";

            box.appendChild(title);
            box.appendChild(graphDiv);

            document.body.appendChild(box);

            const data = {
                nodes: new vis.DataSet([]),
                edges: new vis.DataSet([])
            };

            const options = {
                physics: {
                    solver: "forceAtlas2Based",
                    forceAtlas2Based: {
                        gravitationalConstant: -20,
                        centralGravity: 0.01,
                        springLength: 120,
                        springConstant: 0.02,
                        damping: 0.8,
                        avoidOverlap: 1
                    },

                    maxVelocity: 2,
                    minVelocity: 0.02,
                    timestep: 0.35,
                    stabilization: false
                },
                nodes: {
                    shape: "dot",
                    size: 14,
                    font: {
                        color: "white"
                    },
                    chosen: false
                },
                edges: {
                    smooth: {
                        type: "dynamic"
                    },
                    font: {
                        color: "white"
                    },
                    chosen: false
                },
                interaction:{
                    selectConnectedEdges: false
                },
            };

            const network = new vis.Network(graphDiv, data, options);
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeID = params.nodes[0];
                    socket.send(JSON.stringify({
                        graph: name,
                        node: nodeID,
                        value: 1
                    }));
                }
            });
            network.on("oncontext", function (params) {
                params.event.preventDefault();
                const nodeID = network.getNodeAt(params.pointer.DOM);
                if (nodeID) {
                    socket.send(JSON.stringify({
                        graph: name,
                        node: nodeID,
                        value: -1
                    }));
                }
            });

            const deadOverlay = document.createElement("div");
            deadOverlay.style.position = "absolute";
            deadOverlay.style.top = "0";
            deadOverlay.style.left = "0";
            deadOverlay.style.width = "100%";
            deadOverlay.style.height = "100%";
            deadOverlay.style.background = "rgba(40, 10, 10, 0.85)";
            deadOverlay.style.display = "none";
            deadOverlay.style.flexDirection = "column";
            deadOverlay.style.justifyContent = "center";
            deadOverlay.style.alignItems = "center";
            deadOverlay.style.zIndex = "20";
            deadOverlay.style.color = "tomato";
            deadOverlay.style.fontFamily = "consolas, monospace";
            deadOverlay.style.pointerEvents = "none";
            deadOverlay.innerHTML = "<h2 style='margin:0;'>CREATURE DEAD</h2><p style='color:#ccc; margin-top:5px;'>Slot Empty</p>";

            const respawnBtn = document.createElement("button");
            respawnBtn.innerText = "Respawn Clone";
            respawnBtn.style.marginTop = "15px";
            respawnBtn.style.width = "160px";
            respawnBtn.style.padding = "8px";
            respawnBtn.style.background = "#333";
            respawnBtn.style.color = "white";
            respawnBtn.style.border = "1px solid #8fdfff";
            respawnBtn.style.cursor = "pointer";
            respawnBtn.style.pointerEvents = "auto";
            respawnBtn.onclick = () => {
                socket.send(JSON.stringify({ action: "respawnCreature", slot: name }));
            };

            deadOverlay.appendChild(respawnBtn);
            box.appendChild(deadOverlay);

            networks.push({ name, data, network, box, graphDiv, deadOverlay });
        }
        async function loadConfig()  {
            const response = await fetch("Config.json");
            runtimeConfig = await response.json();
            console.log(runtimeConfig);
        }

        async function start() {
            await loadConfig();

            //for (const def of sliderDefs) {
            //    createSlider(def);
            //}

            for (const name of graphNames) {
                createGraphContainer(name);
            }
        }

        start();

    </script>
</body>
</html>
