        const graphNames = [
            "alpha",

        let runtimeConfig = {};

        const controls = document.getElementById("controls");
        //#region resetButton
        const resetButton = document.createElement("button");
        resetButton.innerText = "Reload Default";
        resetButton.style.width = "100%";
        resetButton.style.marginBottom = "12px";
        resetButton.style.padding = "6px";
        resetButton.style.background = "#333";
        resetButton.style.color = "white";
        resetButton.style.border = "1px solid #555";
        resetButton.onclick = async () => {
            const response = await fetch("Config.json");
            runtimeConfig = await response.json();

                {
                    method: "POST",
                    headers:
                    {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(runtimeConfig)
                });
            location.reload();
        };
        controls.appendChild(resetButton);

        //#region buttonToGenome

        switchToGenome.innerText = "Return to Genome";

        function createSlider(def) {
            const wrapper = document.createElement("div");
            wrapper.style.marginBottom = "10px";

            const label = document.createElement("div");
            label.innerText =`${def.key}: ${runtimeConfig[def.key]}`;
            label.style.fontSize = "12px";

            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = def.min;
            slider.max = def.max;
            slider.step = def.step;
            console.log(def.key, runtimeConfig[def.key]);
            slider.value = runtimeConfig[def.key];;
            slider.style.width = "100%";

            slider.oninput = async () => {
                const value = parseFloat(slider.value);
                runtimeConfig[def.key] = value;;
                label.innerText = `${def.key}: ${value.toFixed(4)}`;

                await fetch("/config",
                    {
                        method: "POST",
                        headers:
                        {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(runtimeConfig)
                    });
            };

            wrapper.appendChild(label);
            wrapper.appendChild(slider);

            controls.appendChild(wrapper);
        }
        function createGraphContainer(name) {
            const box = document.createElement("div");

            box.style.width = "48%";
            box.style.height = "500px";
            box.style.background = "#1a1a1a";
            box.style.border = "1px solid #333";
            box.style.position = "relative";

            const title = document.createElement("div");
            title.innerText = name;

            title.style.position = "absolute";
            title.style.left = "10px";
            title.style.top = "6px";
            title.style.color = "white";
            title.style.fontFamily = "consolas";
            title.style.fontSize = "14px";
            title.style.zIndex = "10";

            const graphDiv = document.createElement("div");

            graphDiv.style.width = "100%";
            graphDiv.style.height = "100%";

            box.appendChild(title);
            box.appendChild(graphDiv);

            document.body.appendChild(box);

            const data = {
                nodes: new vis.DataSet([]),
                edges: new vis.DataSet([])
            };

            const options = {
                physics: {
                    solver: "forceAtlas2Based",
                    forceAtlas2Based: {
                        gravitationalConstant: -20,
                        centralGravity: 0.01,
                        springLength: 120,
                        springConstant: 0.02,
                        damping: 0.8,
                        avoidOverlap: 1
                    },

                    maxVelocity: 2,
                    minVelocity: 0.02,
                    timestep: 0.35,
                    stabilization: false
                },
                nodes: {
                    shape: "dot",
                    size: 14,
                    font: {
                        color: "white"
                    },
                    chosen: false
                },
                edges: {
                    smooth: {
                        type: "dynamic"
                    },
                    font: {
                        color: "white"
                    },
                    chosen: false
                },
                interaction:{
                    selectConnectedEdges: false
                },
            };

            const network = new vis.Network(graphDiv, data, options);
            network.on("click", async function (params) {
                if (params.nodes.length > 0) {
                    const nodeID = params.nodes[0];
                    await fetch("/stimulate",
                        {
                            method: "POST",
                            headers:
                            {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(
                                {
                                    graph: name,
                                    node: nodeID,
                                    value: 1
                                })
                        });
                }
            });
            network.on("oncontext", async function (params) {
                params.event.preventDefault();
                const nodeID = network.getNodeAt(params.pointer.DOM);
                if (nodeID) {
                    await fetch("/stimulate",
                        {
                            method: "POST",
                            headers:
                            {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(
                                {
                                    graph: name,
                                    node: nodeID,
                                    value: -1
                                })
                        });
                }
            });
            networks.push({ name, data, network });
        }
        async function updateGraph(graphObj) {
            const response = await fetch(
                graphObj.name + "_Brain.json?t=" + Date.now()
            );

            const graph = await response.json();
            console.log(graph.nodes);
            const nodeIDs = new Set(graph.nodes.map(n => n.id));
            const edgeIDs = new Set(graph.edges.map(e => e.id));

            graphObj.data.nodes.forEach(node => {
                if (!nodeIDs.has(node.id)) {
                    graphObj.data.nodes.remove(node.id);
                }
            });
            graphObj.data.edges.forEach(edge => {
                if (!edgeIDs.has(edge.id)) {
                    graphObj.data.edges.remove(edge.id);
                }
            });

            for (const node of graph.nodes) {
                const v = Math.abs(node.activation);

                let bg;
                switch (node.neuronType) {
                    case "Sensor":
                        bg = "rgb(40,120,255)";
                        break;
                    case "Math":
                        bg = "rgb(255, 255, 255)";
                        break;
                    case "Action":
                        bg = "rgb(151, 63, 209)";
                        break;
                    default:
                        bg = "rgb(180,180,180)";
                }

                let border;
                if (node.activation >= 0) {
                    border = "rgb(150,240,255)";
                }
                else {
                    border = "rgb(255,90,90)";
                }

                node.color =
                {
                    background: bg,
                    border: border
                };

                const alpha = Math.min(0.15 + v * 0.85, 1);
                node.shadow =
                {
                    enabled: v > 0.04,
                    color: node.activation >= 0
                            ? `rgba(100,220,255,${alpha})`
                            : `rgba(255,70,0,${alpha})`,
                    size: 30,
                    x: 0,
                    y:0
                };

                node.borderWidth = v * 15

                const degree =
                    (node.incoming || 0)
                    + (node.outgoing || 0);
                node.size = 7 + Math.sqrt(degree) * 10 ;
            }
            for (const edge of graph.edges) {
                const s = Math.abs(edge.signal);
                edge.width = 0.5 + s * 10;
                const alpha = 0.25 + s * 1.5;
                const intensity = Math.floor(60 + s * 300);

                if (edge.signal >= 0) {
                    edge.color = `rgb(0,${intensity},255)`;
                }
                else {
                    edge.color = `rgb(${intensity},80,80)`;
                }
            }

            graphObj.data.nodes.update(graph.nodes);
            graphObj.data.edges.update(graph.edges);
        }
        function updateAll() {
            for (const graph of networks) {
                updateGraph(graph);
            }
        }
        async function loadConfig()  {
            const response = await fetch("Config.json");
            runtimeConfig = await response.json();
            console.log(runtimeConfig);
        }
        async function start() {
            await loadConfig();

            //for (const def of sliderDefs) {
            //    createSlider(def);
            //}

            for (const name of graphNames) {
                createGraphContainer(name);
            }

            updateAll();
            setInterval(updateAll, 50);
        }

        start();
