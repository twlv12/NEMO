<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEMO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: consolas, monospace;
            color: white;
        }
        #sim-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            background-color: #1a1a1a;
            cursor: crosshair;
            
            width: 90vmin;
            height: 90vmin;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #222;
            padding: 12px;
            border: 1px solid #444;
            color: white;
            font-family: consolas;
            min-width: 220px;
            max-height: 90vh;
            overflow-y: auto;
        }
        button {
            width: 100%;
            margin-bottom: 12px;
            padding: 6px;
            background: #333;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            font-family: consolas;
        }
        button:hover {
            background: #444;
        }
        
        #context-menu {
            display: none;
            position: absolute;
            background: #222;
            border: 1px solid #555;
            padding: 10px;
            z-index: 2000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            width: 160px;
        }
        #context-menu .menu-title {
            color: #8fdfff;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        #context-menu button {
            margin-bottom: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div style="margin-bottom: 12px; color: #8fdfff; font-size: 15px; font-weight: bold;">NEMO Simulation</div>
        <button onclick="startSimulation()" style="border-color: #8fdfff; color: #8fdfff;">START SIMULATION</button>
        <!-- Updated Routing here: -->
        <button onclick="switchView(1, 'genome.html')">View Genomes</button>
        <button onclick="switchView(2, 'brain.html')">View Brains</button>
    </div>

    <div id="sim-container">
        <canvas id="worldCanvas"></canvas>
    </div>

    <div id="context-menu">
        <div class="menu-title">Load Genome:</div>
        <button onclick="loadGenome('alpha')">Slot 1 [Alpha]</button>
        <button onclick="loadGenome('beta')">Slot 2 [Beta]</button>
        <button onclick="loadGenome('gamma')">Slot 3 [Gamma]</button>
        <button onclick="loadGenome('delta')">Slot 4 [Delta]</button>
    </div>

    <script>
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const contextMenu = document.getElementById('context-menu');

        const socket = new WebSocket("ws://127.0.0.1:8181");

        let CELL_SIZE = 12; // Pixels per grid cell
        let worldWidth = 0;
        let worldHeight = 0;

        canvas.width = 800;
        canvas.height = 800;

        let staticBlocks = [];
        let foods = [];
        let creaturesMap = new Map();

        let selectedCreatureId = null;

        socket.onopen = () => {
            console.log("Connected to NEMO (Petri View)");
            socket.send(JSON.stringify({ action: "updateConfig", key: "currentView", value: 0 }));
        };

        function startSimulation() {
            socket.send(JSON.stringify({ action: "startWorld" }));
        }

        function switchView(viewId, url) {
            socket.send(JSON.stringify({ action: "updateConfig", key: "currentView", value: viewId }));
            window.location.href = url;
        }

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // More robust check: Only parse petri frames, ignore brain/genome graph nodes
                if (!data.creatures) return;

                if (worldWidth !== data.width || worldHeight !== data.height) {
                    worldWidth = data.width;
                    worldHeight = data.height;
                    canvas.width = worldWidth * CELL_SIZE;
                    canvas.height = worldHeight * CELL_SIZE;
                }

                staticBlocks = data.blocks;
                foods = data.foods;

                const currentIDs = new Set();

                data.creatures.forEach(c => {
                    currentIDs.add(c.id);
                    const targetAngle = (c.dir - 2) * (Math.PI / 4);

                    if (!creaturesMap.has(c.id)) {
                        creaturesMap.set(c.id, {
                            x: c.x, y: c.y, targetX: c.x, targetY: c.y,
                            angle: targetAngle, targetAngle: targetAngle,
                            r: c.r, g: c.g, b: c.b
                        });
                    } else {
                        let existing = creaturesMap.get(c.id);
                        existing.targetX = c.x;
                        existing.targetY = c.y;
                        existing.targetAngle = targetAngle;

                        while (existing.targetAngle - existing.angle > Math.PI) existing.targetAngle -= Math.PI * 2;
                        while (existing.targetAngle - existing.angle < -Math.PI) existing.targetAngle += Math.PI * 2;
                    }
                });

                for (let id of creaturesMap.keys()) {
                    if (!currentIDs.has(id)) {
                        creaturesMap.delete(id);
                        if (selectedCreatureId === id) hideContextMenu();
                    }
                }
            } catch (err) { }
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            let clickedId = null;
            let minDist = Infinity;

            for (const [id, c] of creaturesMap.entries()) {
                const cx = (c.x * CELL_SIZE) + CELL_SIZE / 2;
                const cy = (c.y * CELL_SIZE) + CELL_SIZE / 2;
                const dist = Math.hypot(cx - clickX, cy - clickY);

                if (dist < CELL_SIZE * 1.5 && dist < minDist) {
                    minDist = dist;
                    clickedId = id;
                }
            }

            if (clickedId) {
                selectedCreatureId = clickedId;
                contextMenu.style.display = "block";
                contextMenu.style.left = (e.clientX + 15) + "px";
                contextMenu.style.top = (e.clientY - 20) + "px";
            } else {
                hideContextMenu();
            }
        });

        function loadGenome(slotName) {
            if (selectedCreatureId) {
                socket.send(JSON.stringify({
                    action: "loadGenome",
                    creatureId: selectedCreatureId,
                    slot: slotName
                }));
            }
            hideContextMenu();
        }

        function hideContextMenu() {
            contextMenu.style.display = "none";
            selectedCreatureId = null;
        }

        document.addEventListener('click', (e) => {
            if (e.target !== canvas && !contextMenu.contains(e.target)) {
                hideContextMenu();
            }
        });

        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        function drawCreature(ctx, r, g, b) {
            const size = CELL_SIZE * 1.1;
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

            ctx.beginPath();
            ctx.moveTo(size / 2, 0);
            ctx.lineTo(-size / 2, size / 2.2);
            ctx.quadraticCurveTo(-size / 5, 0, -size / 2, -size / 2.2);
            ctx.closePath();

            ctx.fill();
        }

        function render() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Blocks
            ctx.fillStyle = '#000000';
            staticBlocks.forEach(b => {
                ctx.fillRect(b.x * CELL_SIZE, b.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });

            // FIX: Fast Batched Food Rendering (Rectangles instead of Arcs)
            ctx.fillStyle = '#006400'; // Plants
            foods.forEach(f => {
                if (!f.meat) {
                    ctx.fillRect((f.x * CELL_SIZE) + CELL_SIZE * 0.2, (f.y * CELL_SIZE) + CELL_SIZE * 0.2, CELL_SIZE * 0.6, CELL_SIZE * 0.6);
                }
            });

            ctx.fillStyle = '#800000'; // Meat
            foods.forEach(f => {
                if (f.meat) {
                    ctx.fillRect((f.x * CELL_SIZE) + CELL_SIZE * 0.2, (f.y * CELL_SIZE) + CELL_SIZE * 0.2, CELL_SIZE * 0.6, CELL_SIZE * 0.6);
                }
            });

            // Creatures
            creaturesMap.forEach((c, id) => {
                c.x = lerp(c.x, c.targetX, 0.2);
                c.y = lerp(c.y, c.targetY, 0.2);
                c.angle = lerp(c.angle, c.targetAngle, 0.2);

                ctx.save();
                ctx.translate((c.x * CELL_SIZE) + (CELL_SIZE / 2), (c.y * CELL_SIZE) + (CELL_SIZE / 2));
                ctx.rotate(c.angle);

                drawCreature(ctx, c.r, c.g, c.b);

                if (id === selectedCreatureId) {
                    ctx.beginPath();
                    ctx.arc(0, 0, CELL_SIZE, 0, Math.PI * 2);
                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 2]);
                    ctx.stroke();
                }

                ctx.restore();
            });

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
